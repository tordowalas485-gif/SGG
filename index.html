<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Sistema de Gestión de Gastos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">

    <header>
        <button id="theme-toggle" aria-label="Cambiar modo de color" class="btn-secondary">🌙 Modo Oscuro</button>
    </header>

    <main class="auth-container">
        <section id="login-section" class="auth-card">
            <h1>Iniciar Sesión</h1>
            <p class="subtitle">SGG - Controla tus finanzas</p>
            
            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" required placeholder="correo@ejemplo.com">
                </div>
                <div class="form-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">Ingresar</button>
            </form>
            
            <div class="auth-links">
                <button type="button" class="link-btn" onclick="switchView('register')">Crear una cuenta</button>
                <button type="button" class="link-btn" onclick="switchView('recover')">¿Olvidaste tu contraseña?</button>
            </div>
            <div id="login-feedback" class="feedback-msg" aria-live="polite"></div>
        </section>

        <section id="register-section" class="auth-card hidden">
            <h2>Crear Cuenta</h2>
            <p class="subtitle">Únete al Sistema de Gestión de Gastos</p>
            
            <form id="register-form" novalidate>
                <div class="form-group">
                    <label for="reg-name">Nombre Completo</label>
                    <input type="text" id="reg-name" required placeholder="Juan Pérez">
                </div>
                <div class="form-group">
                    <label for="reg-email">Correo Electrónico</label>
                    <input type="email" id="reg-email" required placeholder="juan@ejemplo.com">
                </div>
                <div class="form-group">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" required placeholder="Mínimo 6 caracteres">
                </div>
                <div class="form-group">
                    <label for="reg-confirm-password">Confirmar Contraseña</label>
                    <input type="password" id="reg-confirm-password" required placeholder="Repite tu contraseña">
                </div>
                <button type="submit" class="btn-primary">Registrarse</button>
            </form>
            
            <div class="auth-links">
                <button type="button" class="link-btn" onclick="switchView('login')">¿Ya tienes cuenta? Inicia sesión</button>
            </div>
            <div id="register-feedback" class="feedback-msg" aria-live="polite"></div>
        </section>

        <section id="recover-section" class="auth-card hidden">
            <h2>Recuperar Contraseña</h2>
            <p class="subtitle">Te enviaremos las instrucciones de restablecimiento</p>
            
            <form id="recover-form" novalidate>
                <div class="form-group">
                    <label for="recover-email">Correo Electrónico Registrado</label>
                    <input type="email" id="recover-email" required placeholder="correo@ejemplo.com">
                </div>
                <button type="submit" class="btn-primary">Enviar Enlace</button>
            </form>
            
            <div class="auth-links">
                <button type="button" class="link-btn" onclick="switchView('login')">Volver al Inicio de Sesión</button>
            </div>
            <div id="recover-feedback" class="feedback-msg" aria-live="polite"></div>
        </section>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
